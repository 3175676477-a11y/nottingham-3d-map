name: Archive app version
on:
  push:
    branches: [codex/sherwood-hall-map]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solar-atlas-archives
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
